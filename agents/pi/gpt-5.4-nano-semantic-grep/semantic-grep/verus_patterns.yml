---
# Rule 5: Capture Functions with Contracts
# Matches functions that have requires, ensures, or decreases clauses
id: capture-functions-with-contracts
language: verus
rule:
  any:
    - kind: function_item
      has:
        kind: fn_qualifier
        has:
          kind: requires_clause
    - kind: function_item
      has:
        kind: fn_qualifier
        has:
          kind: ensures_clause
    - kind: function_item
      has:
        kind: fn_qualifier
        has:
          kind: decreases_clause
    - kind: function_signature_item
      has:
        kind: fn_qualifier
        has:
          kind: requires_clause
    - kind: function_signature_item
      has:
        kind: fn_qualifier
        has:
          kind: ensures_clause
    - kind: function_signature_item
      has:
        kind: fn_qualifier
        has:
          kind: decreases_clause
