# Rule 1: Capture Spec Functions
# Matches functions with 'spec' keyword in their qualifiers (both with and without bodies)
id: capture-spec-functions
language: verus
rule:
  any:
    - kind: function_item
      has:
        kind: function_mode
        regex: "spec"
    - kind: function_signature_item
      has:
        kind: function_mode
        regex: "spec"

---
# Rule 2: Capture Proof Functions
# Matches functions with 'proof' keyword (both with and without bodies)
id: capture-proof-functions
language: verus
rule:
  any:
    - kind: function_item
      has:
        kind: function_mode
        regex: "proof"
    - kind: function_signature_item
      has:
        kind: function_mode
        regex: "proof"

---
# Rule 3: Capture Proof Blocks
# Matches proof { ... } expressions
id: capture-proof-blocks
language: verus
rule:
  kind: proof_block

